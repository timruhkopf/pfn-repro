# @package _global_
# Original launch: n_steps=400000 with task.trainer.deadline=2026-10-20T22:00 task.trainer.fit_to_deadline=true
# (pfn-acqpolicy scripts/ulysses_alpha.sh); the cosine schedule was fitted to the deadline.
# The recipe of the registered `alpha_conditioned_large` (pfn-acqpolicy 4d92fd5; fitted to a deadline,
# it ran 156,963 of 400,000 configured steps, 124 ms/step on an RTX 3090).
defaults:
  - /prior: bnn
  - override /task: train_alpha
task:
  device: cuda
  base_checkpoint: pfn_large
  trainer: {n_steps: 400000, warmup_steps: 2000, log_every: 1000, save_every: 10000, mixed_precision: true}
  validation: {every_n_steps: 5000}
