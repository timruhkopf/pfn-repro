# @package _global_
# A few training steps of any prior x surrogate pair on CPU: just run local sanity experiment=train_smoke
#   prior=bnn|mf  surrogate=pfn|tabpfn
defaults:
  - /prior: bnn
  - /surrogate: pfn
  - override /task: train_pfn
surrogate: {d_model: 32, n_layers: 2, d_ff: 64, n_bins: 32}
task:
  x_dim: 3
  batch_size: 8
  trainer: {n_steps: 30, min_train: 2, max_train: 10, n_test: 16, warmup_steps: 5, log_every: 10}
  validation: {dims: [1, 3], context_sizes: [5], n_functions: 8, n_points: 16}
