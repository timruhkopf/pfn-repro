# @package _global_
# Regular PFN on the MF prior (ifBO's FT-PFN prior), overnight pilot (issue #4). pfn_large's size and training
# recipe; inputs [config (1-3 hyperparameters), fidelity], y = 1 - performance. Episodes: FastMFPrior with
# exact_stream=false (MFPrior's distribution, fewer torch draws; priors/mf/fast.py), made ahead in 8 worker
# processes. Probe on ulysses (8 cores, 2026-10-22): 55 ms/step against 45 ms for the GPU step alone (one core:
# MFPrior 1.28 s per batch, FastMFPrior 0.39 s exact / 0.24 s off the exact stream).
# Launch with the deadline: task.trainer.deadline=<ISO> (the cosine schedule is fitted to end by then).
defaults:
  - /prior: mf
  - /surrogate: pfn
  - override /task: train_pfn
prior: {exact_stream: false}
surrogate: {d_model: 256, n_heads: 8, n_layers: 8, d_ff: 1024, n_bins: 1000}
task:
  device: cuda
  x_dim: 3
  variable_dim_min: 1
  prefetch_workers: 8
  trainer:
    n_steps: 1500000
    warmup_steps: 15000
    log_every: 1000
    save_every: 20000
    mixed_precision: true
    deadline: null
    fit_to_deadline: true
    calib_steps: 300
    deadline_margin: 0.9
  validation:
    dims: [1, 2, 3]
    every_n_steps: 5000
